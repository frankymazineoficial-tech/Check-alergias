@font-face { font-family: "Inter TA"; src: url("/fuente-inter-400.woff") format("woff"); font-weight: 400 500; font-display: swap; }
@font-face { font-family: "Inter TA"; src: url("/fuente-inter-800.woff") format("woff"); font-weight: 800 900; font-display: swap; }
:root { --navy: #0b132b; --sky: #38bdf8; --green: #10b981; --green-ink: #052e1c; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--navy); color: #f8fafc; font-family: "Inter TA", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.55; }
a { color: var(--sky); }
:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; border-radius: 6px; }
.top { max-width: 1200px; width: 100%; margin: 0 auto; padding: 18px 24px; }
.brand { display: inline-flex; align-items: center; gap: 10px; color: #f8fafc; text-decoration: none; font-size: 21px; font-weight: 800; }
.brand img { width: 40px; height: 40px; border-radius: 10px; }
main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 40px 24px 80px; }
.code { font-size: 15px; font-weight: 800; letter-spacing: 0.1em; color: #6ee7b7; }
h1 { margin: 0; font-size: clamp(30px, 5vw, 48px); line-height: 1.1; letter-spacing: -0.03em; }
p { margin: 0; color: #cbd5e1; max-width: 520px; font-size: 17px; }
.ctas { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 8px; }
.btn { display: inline-flex; align-items: center; min-height: 50px; padding: 0 22px; border-radius: 12px; font-weight: 700; text-decoration: none; }
.btn-green { background: var(--green); color: var(--green-ink); }
.btn-ghost { color: #fff; border: 1.5px solid #64748b; }

<a class="btn btn-ghost" href="/">Ir al inicio</a>
</div>
</main>
